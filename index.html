<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Konoha Arena — 1 on 1</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #07101a; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    background: #101d28; box-shadow: 0 18px 60px rgba(0,0,0,.6);
    width: min(100vw, 177.7778vh);
    height: min(100vh, 56.25vw);
    image-rendering: auto;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #cfe6f5; font-size: 17px; letter-spacing: .5px; background: #07101a;
  }
  #boot.hidden { display: none; }
  #boot .err { color: #ffb4b4; max-width: 520px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="boot">Loading fighters…</div>
  <script src="audio.js"></script>
  <script src="fighter.js"></script>
</body>
</html>
